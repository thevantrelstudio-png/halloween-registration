<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Night '26 | Euro Club x Zenith Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- html5-qrcode library for live camera QR scanning -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: rgba(22, 20, 28, 0.85);
      --accent-orange: #ff6b00;
      --accent-glow: #ff8800;
      --accent-purple: #9d4edd;
      --text-main: #f8f9fa;
      --text-sub: #a0a0ab;
      --border-color: rgba(255, 107, 0, 0.25);
      --input-bg: rgba(15, 14, 20, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-dark); color: var(--text-main);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      padding: 24px 16px; position: relative; overflow-x: hidden;
    }

    /* Ambient Lighting Background Effects */
    .bg-glow-1 {
      position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
      width: 380px; height: 380px; background: radial-gradient(circle, rgba(255,107,0,0.3) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none; filter: blur(40px); z-index: 0;
    }

    .bg-glow-2 {
      position: fixed; bottom: -150px; right: -50px;
      width: 400px; height: 400px; background: radial-gradient(circle, rgba(157,78,221,0.2) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none; filter: blur(50px); z-index: 0;
    }

    .container {
      width: 100%; max-width: 500px; background: var(--card-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color); border-radius: 24px;
      padding: 28px 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 107, 0, 0.12);
      position: relative; z-index: 1;
    }

    .header { text-align: center; margin-bottom: 20px; position: relative; }

    /* Co-Branding Club Logos */
    .brand-logos {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin-bottom: 12px; margin-top: 10px;
    }

    .club-logo {
      height: 42px; width: auto; object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      transition: transform 0.2s ease;
    }

    .club-logo:hover { transform: scale(1.05); }
    .logo-divider { color: var(--accent-orange); font-size: 16px; font-weight: 700; opacity: 0.6; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 107, 0, 0.12); border: 1px solid rgba(255, 107, 0, 0.3);
      color: var(--accent-orange); padding: 5px 12px; border-radius: 50px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px;
    }

    .admin-toggle-btn {
      position: absolute; right: 0; top: 0;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-sub); border-radius: 8px; padding: 5px 10px; font-size: 11px;
      cursor: pointer; font-weight: 600; transition: all 0.2s ease;
    }

    .admin-toggle-btn:hover { color: #fff; border-color: var(--accent-orange); background: rgba(255, 107, 0, 0.15); }

    .header h1 {
      font-size: 24px; font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #ffaa66 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .header p { color: var(--text-sub); font-size: 12px; margin-top: 4px; }

    /* Admin Tab Buttons */
    .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 10px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
      color: var(--text-sub); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(255, 107, 0, 0.2); border-color: var(--accent-orange); color: #fff;
    }

    /* Pending Approval Cards */
    .pending-card {
      background: rgba(15, 14, 20, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .pending-info { font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
    .pending-info b { color: #fff; }
    .pending-actions { display: flex; gap: 8px; }

    .btn-view {
      flex: 1; padding: 8px; background: rgba(255, 255, 255, 0.1);
      border: none; border-radius: 8px; color: #fff; font-size: 12px; font-weight: 600;
      text-decoration: none; text-align: center;
    }

    .btn-approve {
      flex: 1; padding: 8px; background: #00c853; border: none;
      border-radius: 8px; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #d1d1d6; margin-bottom: 6px; text-transform: uppercase; }

    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%; padding: 12px; background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
      color: #fff; font-size: 14px; outline: none; transition: all 0.25s ease;
    }

    input:focus { border-color: var(--accent-orange); box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.2); }

    .file-dropzone {
      border: 2px dashed rgba(255, 107, 0, 0.35); background: rgba(15, 14, 20, 0.5);
      border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; position: relative; transition: all 0.25s ease;
    }

    .file-dropzone:hover { border-color: var(--accent-orange); background: rgba(255, 107, 0, 0.05); }
    .file-dropzone input[type="file"] { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }

    .btn-submit {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #ff6b00 0%, #e65c00 100%);
      border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 10px; box-shadow: 0 10px 25px rgba(255, 107, 0, 0.35); transition: all 0.25s ease;
    }

    .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(255, 107, 0, 0.5); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; background: #444; box-shadow: none; }

    #status { margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; display: none; }
    #status.success { display: block; background: rgba(0, 230, 118, 0.12); border: 1px solid rgba(0, 230, 118, 0.4); color: #00e676; }
    #status.error { display: block; background: rgba(255, 23, 68, 0.12); border: 1px solid rgba(255, 23, 68, 0.4); color: #ff1744; }

    #adminPanel { display: none; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); background: #000; }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <div class="header">
      <button class="admin-toggle-btn" onclick="openAdminPrompt()">⚙️ Admin Mode</button>
      
      <!-- Brand Logos Container -->
      <div class="brand-logos">
        <img src="euro-club-logo.png" alt="Euro Club Logo" class="club-logo" onerror="this.style.display='none'">
        <span class="logo-divider">×</span>
        <img src="zenith-club-logo.png" alt="Zenith Club Logo" class="club-logo" onerror="this.style.display='none'">
      </div>

      <div class="badge">🎃 VIP Portal</div>
      <h1 id="portalTitle">Halloween Night Pass</h1>
      <p id="portalSub">Register below to receive your official QR entry pass.</p>

      <!-- Event Details (Location & Time) -->
      <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 4px; align-items: center;">
        <span style="font-size: 11px; font-weight: 700; color: var(--accent-orange); background: rgba(255, 107, 0, 0.1); border: 1px solid rgba(255, 107, 0, 0.2); padding: 4px 12px; border-radius: 20px;">
          📍 Somma, Yendada
        </span>
        <span style="font-size: 11px; color: var(--text-sub); font-weight: 600;">
          ⏰ 5:00 PM – 8:30 PM
        </span>
      </div>
    </div>

    <!-- Registration View -->
    <div id="userRegistrationView">
      <form id="registrationForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" required placeholder="Enter full name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="Enter email address">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" required placeholder="Enter phone number">
        </div>
        <div class="form-group">
          <label>Payment Screenshot</label>
          <div class="file-dropzone">
            <div style="font-size:13px; font-weight:600;">📸 Upload Transaction Proof</div>
            <div style="font-size:11px; color:var(--text-sub);" id="fileNamePreview">Tap to select screenshot</div>
            <input type="file" id="paymentScreenshot" accept="image/*" required>
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Submit Registration ➔</button>
      </form>
    </div>

    <!-- Admin Control Hub -->
    <div id="adminPanel">
      <div class="admin-tabs">
        <button class="tab-btn active" id="tabPendingBtn" onclick="switchAdminTab('pending')">📋 Approvals (<span id="pendingCount">0</span>)</button>
        <button class="tab-btn" id="tabScannerBtn" onclick="switchAdminTab('scanner')">📸 Gate Scanner</button>
      </div>

      <!-- Tab 1: Pending Approvals List -->
      <div id="tabPendingView">
        <div id="pendingListContainer">Loading pending submissions...</div>
      </div>

      <!-- Tab 2: Gate QR Scanner -->
      <div id="tabScannerView" style="display:none;">
        <div id="reader"></div>
      </div>

      <button onclick="closeAdminMode()" class="btn-submit" style="background: #333; margin-top: 15px;">Exit Admin Mode</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // Live Apps Script Web App URL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxYInwIdrT0pMFlAmEgDLR0Ao8MmwxyDGNMk60eOekyCc6ZZnEP4HkCjCPZNgZ0Pi_6aA/exec";
    
    // 6-digit passcode to unlock Admin Mode
    const ADMIN_PIN = "849204";

    let html5QrcodeScanner = null;

    function openAdminPrompt() {
      const pin = prompt("Enter 6-Digit Admin Passcode:");
      if (pin === ADMIN_PIN) {
        document.getElementById('userRegistrationView').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('portalTitle').innerText = 'Admin Control Hub';
        document.getElementById('portalSub').innerText = 'Review payments & scan attendee passes.';
        switchAdminTab('pending');
      } else if (pin !== null) {
        alert("Access Denied: Incorrect PIN!");
      }
    }

    function closeAdminMode() {
      if (html5QrcodeScanner) html5QrcodeScanner.clear();
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('userRegistrationView').style.display = 'block';
      document.getElementById('portalTitle').innerText = 'Halloween Night Pass';
      document.getElementById('portalSub').innerText = 'Register below to receive your official QR entry pass.';
    }

    function switchAdminTab(tab) {
      if (tab === 'pending') {
        document.getElementById('tabPendingView').style.display = 'block';
        document.getElementById('tabScannerView').style.display = 'none';
        document.getElementById('tabPendingBtn').classList.add('active');
        document.getElementById('tabScannerBtn').classList.remove('active');
        if (html5QrcodeScanner) html5QrcodeScanner.clear();
        fetchPendingApprovals();
      } else {
        document.getElementById('tabPendingView').style.display = 'none';
        document.getElementById('tabScannerView').style.display = 'block';
        document.getElementById('tabScannerBtn').classList.add('active');
        document.getElementById('tabPendingBtn').classList.remove('active');
        startScanner();
      }
    }

    // Fetch pending registrations from Google Sheets
    async function fetchPendingApprovals() {
      const container = document.getElementById('pendingListContainer');
      container.innerHTML = "Fetching pending registrations...";
      try {
        const res = await fetch(WEB_APP_URL + "?action=getPending");
        const data = await res.json();
        if (data.result === "success" && data.pending.length > 0) {
          document.getElementById('pendingCount').innerText = data.pending.length;
          container.innerHTML = data.pending.map(item => `
            <div class="pending-card">
              <div class="pending-info">
                <b>${item.name}</b> (${item.passId})<br>
                ✉️ ${item.email}<br>
                📞 ${item.phone}
              </div>
              <div class="pending-actions">
                <a href="${item.screenshotUrl}" target="_blank" class="btn-view">View Proof 🖼️</a>
                <button onclick="approveUser(${item.row}, '${item.name}')" class="btn-approve">Approve Pass ✅</button>
              </div>
            </div>
          `).join('');
        } else {
          document.getElementById('pendingCount').innerText = "0";
          container.innerHTML = "<p style='text-align:center; color:var(--text-sub); font-size:13px;'>No pending approvals!</p>";
        }
      } catch (e) {
        container.innerHTML = "<p style='color:#ff1744; font-size:13px;'>Error loading approvals.</p>";
      }
    }

    // Approve user and dispatch QR pass email
    async function approveUser(row, name) {
      if (!confirm("Approve pass for " + name + " and send QR email?")) return;
      const statusDiv = document.getElementById('status');
      statusDiv.className = ""; statusDiv.style.display = "block";
      statusDiv.innerText = "Approving pass & sending email to " + name + "...";

      try {
        const res = await fetch(WEB_APP_URL + "?action=approvePass&row=" + row);
        const data = await res.json();
        if (data.result === "success") {
          statusDiv.className = "success";
          statusDiv.innerText = "✅ Approved! QR Pass emailed to " + name;
          fetchPendingApprovals();
        } else { throw new Error(); }
      } catch (e) {
        statusDiv.className = "error";
        statusDiv.innerText = "Failed to approve pass.";
      }
    }

    // Gate Scanner
    function startScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } });
      html5QrcodeScanner.render(async function(decodedText) {
        const statusDiv = document.getElementById('status');
        statusDiv.className = ""; statusDiv.style.display = "block";
        statusDiv.innerText = "Verifying Pass ID: " + decodedText + "...";
        try {
          const res = await (await fetch(WEB_APP_URL + "?passId=" + encodeURIComponent(decodedText))).json();
          if (res.result === "checked_in") {
            statusDiv.className = "success"; statusDiv.innerText = "✅ VALID PASS: " + res.name + " Checked In!";
          } else {
            statusDiv.className = "error"; statusDiv.innerText = "⚠️ INVALID OR ALREADY USED PASS";
          }
        } catch (e) { statusDiv.className = "error"; statusDiv.innerText = "Verification error."; }
      });
    }

    // File Name Preview
    const fileInput = document.getElementById('paymentScreenshot');
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) document.getElementById('fileNamePreview').innerText = fileInput.files[0].name;
    });

    // Handle Form Upload
    document.getElementById('registrationForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');
      submitBtn.disabled = true; submitBtn.innerText = "Submitting...";
      statusDiv.style.display = "none";

      const reader = new FileReader();
      reader.onload = async function() {
        const payload = {
          fullName: document.getElementById('fullName').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          paymentScreenshotBase64: reader.result
        };
        try {
          const res = await (await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })).json();
          if (res.result === "success") {
            statusDiv.className = "success";
            statusDiv.innerText = "🎉 Registration Submitted! Pass ID: " + res.passId + ". Your QR pass will be emailed once approved.";
            document.getElementById('registrationForm').reset();
            document.getElementById('fileNamePreview').innerText = "Tap to select screenshot";
          } else { throw new Error(res.error); }
        } catch (err) {
          statusDiv.className = "error"; statusDiv.innerText = "⚠️ Error: " + err.message;
        } finally {
          submitBtn.disabled = false; submitBtn.innerText = "Submit Registration ➔";
        }
      };
      reader.readAsDataURL(fileInput.files[0]);
    });
  </script>
</body>
</html>
