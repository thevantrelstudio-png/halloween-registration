<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTERLIFE '26 | Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent-orange: #ff6b00;
            --accent-red: #ff3b30;
            --success-green: #30d158;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            
            /* Afterlife '26 Pinterest Horror Collage Background */
            background: linear-gradient(rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.82)), 
                        url('bg.jpg') center/cover no-repeat fixed;
        }

        /* --- APPLE FROSTED GLASS PANELS --- */
        .glass-card {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 18, 22, 0.58) !important;
            backdrop-filter: blur(24px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            border-radius: 28px !important;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.15) !important;
            padding: 32px 28px !important;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .header p {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- GLASS INPUT FIELDS --- */
        input[type="text"], 
        input[type="tel"], 
        input[type="email"], 
        input[type="number"], 
        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.06) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 16px !important;
            color: #ffffff !important;
            padding: 14px 16px !important;
            font-size: 15px !important;
            outline: none;
            transition: all 0.25s ease !important;
        }

        input:focus, select:focus {
            border-color: rgba(255, 107, 0, 0.8) !important;
            background: rgba(255, 255, 255, 0.12) !important;
            box-shadow: 0 0 18px rgba(255, 107, 0, 0.35) !important;
        }

        /* --- PAYMENT QR CARD BLOCK --- */
        .qr-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .qr-card img {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            margin: 12px 0;
            background: #ffffff;
            padding: 8px;
        }

        .qr-card p {
            font-size: 13px;
            color: var(--text-sub);
        }

        /* --- APPLE LIQUID GLASS BUTTONS --- */
        button, .btn {
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.9), rgba(220, 40, 0, 0.9)) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 18px !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            font-size: 16px !important;
            letter-spacing: 0.5px !important;
            padding: 16px 24px !important;
            cursor: pointer !important;
            box-shadow: 0 8px 24px rgba(255, 60, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4) !important;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        button:hover {
            transform: translateY(-2px) scale(1.01) !important;
            box-shadow: 0 12px 30px rgba(255, 60, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.6) !important;
        }

        button:active {
            transform: translateY(1px) scale(0.98) !important;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3) !important;
            margin-top: 12px;
        }

        /* --- EMERGENCY RESET MODAL --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: rgba(25, 25, 30, 0.9);
            border: 1px solid rgba(255, 59, 48, 0.5);
            box-shadow: 0 0 35px rgba(255, 59, 48, 0.3);
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .modal-card h2 {
            color: var(--accent-red);
            font-size: 20px;
            margin: 12px 0 8px;
        }

        .modal-card p {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--accent-red);
            transition: width 1s linear;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="header">
            <h1>AFTERLIFE '26</h1>
            <p>Euro Club × Zenith Club | Somma, Yendada</p>
        </div>

        <form id="registrationForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">WhatsApp Phone Number</label>
                <input type="tel" id="phone" placeholder="+91 XXXXX XXXXX" required>
            </div>

            <div class="qr-card">
                <p><strong>Scan QR to Pay Registration Entry</strong></p>
                <!-- Place your UPI / PhonePe QR image file path here -->
                <img src="payment-qr.jpg" alt="Payment QR Code">
                <p>Upload proof below after completion</p>
            </div>

            <div class="form-group">
                <label for="paymentScreenshot">Payment Screenshot</label>
                <input type="file" id="paymentScreenshot" accept="image/*" required>
                <p id="fileNamePreview" style="font-size: 12px; margin-top: 6px;"></p>
            </div>

            <button type="submit" id="submitBtn">
                <span id="btnText">Confirm & Register</span>
            </button>
        </form>
    </div>

    <!-- Emergency Reset Warning Modal -->
    <div class="modal" id="resetModal">
        <div class="modal-card">
            <div style="font-size: 36px;">⚠️</div>
            <h2>Emergency Database Reset</h2>
            <p>All active registrations are being backed up and emailed to <strong>thevantrelstudio@gmail.com</strong>. Resetting in <span id="timerCount">20</span> seconds...</p>
            
            <div class="progress-bar-container">
                <div class="progress-bar" id="resetProgress"></div>
            </div>

            <button type="button" class="btn-cancel" onclick="cancelReset()">Cancel Reset</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE"; // Replace with your Web App URL
        let resetTimer;

        // File Input Change Preview
        const fileInput = document.getElementById('paymentScreenshot');
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                const preview = document.getElementById('fileNamePreview');
                preview.innerText = "Selected: " + fileInput.files[0].name;
                preview.style.color = "var(--success-green)";
            }
        });

        // Form Submission
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("⚠️ Payment screenshot is mandatory!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            submitBtn.disabled = true;
            btnText.innerText = "Submitting...";

            // FileReader logic for sending image to Apps Script
            const reader = new FileReader();
            reader.onload = async function() {
                const payload = {
                    name: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    image: reader.result.split(',')[1],
                    mimeType: fileInput.files[0].type
                };

                try {
                    const res = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    
                    if (data.result === 'success') {
                        alert("🎉 Registration successful! See you at Afterlife '26!");
                        location.reload();
                    } else {
                        throw new Error();
                    }
                } catch (err) {
                    alert("⚠️ Registration submission error. Please try again.");
                    submitBtn.disabled = false;
                    btnText.innerText = "Confirm & Register";
                }
            };
            reader.readAsDataURL(fileInput.files[0]);
        });

        // Emergency Reset Modal Execution
        function cancelReset() {
            clearInterval(resetTimer);
            document.getElementById('resetModal').style.display = 'none';
            alert("Emergency reset cancelled.");
        }

        async function executeResetDatabase() {
            try {
                const res = await (await fetch(WEB_APP_URL + "?action=resetDatabase")).json();
                if (res.result === "success") {
                    document.getElementById('resetModal').style.display = 'none';
                    alert("✅ Database successfully reset and backup sent to thevantrelstudio@gmail.com!");
                    location.reload();
                } else {
                    throw new Error();
                }
            } catch (e) {
                alert("⚠️ Error executing reset.");
                document.getElementById('resetModal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
