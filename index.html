<!DOCTYPE html>
<html lang="en">

  <title>Halloween Night '26 | VIP Registration</title>

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: rgba(22, 20, 28, 0.75);
      --accent-orange: #ff6b00;
      --accent-glow: #ff8800;
      --text-main: #f8f9fa;
      --text-sub: #a0a0ab;
      --border-color: rgba(255, 107, 0, 0.25);
      --input-bg: rgba(15, 14, 20, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }

    .bg-glow-1 {
      position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(255,107,0,0.3) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none; filter: blur(40px); z-index: 0;
    }

    .container {
      width: 100%; max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 107, 0, 0.1);
      position: relative; z-index: 1;
    }

    .header { text-align: center; margin-bottom: 24px; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 107, 0, 0.12);
      border: 1px solid rgba(255, 107, 0, 0.3);
      color: var(--accent-orange);
      padding: 6px 14px; border-radius: 50px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px;
    }

    .header h1 {
      font-size: 26px; font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #ffaa66 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p { color: var(--text-sub); font-size: 13px; }

    /* Step-by-Step Procedure Box */
    .procedure-box {
      background: rgba(255, 107, 0, 0.05);
      border: 1px solid rgba(255, 107, 0, 0.2);
      border-radius: 16px; padding: 16px;
      margin-bottom: 24px;
    }

    .procedure-title {
      font-size: 12px; font-weight: 700; color: var(--accent-orange);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }

    .steps-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .step-item { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; color: #d1d1d6; line-height: 1.4; }

    .step-num {
      background: rgba(255, 107, 0, 0.2); color: var(--accent-orange);
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 10px; flex-shrink: 0; margin-top: 1px;
    }

    .form-group { margin-bottom: 18px; }

    label { display: block; font-size: 12px; font-weight: 600; color: #d1d1d6; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%; padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: all 0.25s ease;
    }

    input:focus { border-color: var(--accent-orange); box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.2); }

    .file-dropzone {
      position: relative; border: 2px dashed rgba(255, 107, 0, 0.35);
      background: rgba(15, 14, 20, 0.5); border-radius: 14px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.25s ease;
    }

    .file-dropzone:hover { border-color: var(--accent-orange); background: rgba(255, 107, 0, 0.05); }

    .file-dropzone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    .upload-title { font-size: 13px; font-weight: 600; color: var(--text-main); }

    .upload-sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

    .file-name-preview { margin-top: 8px; font-size: 12px; color: var(--accent-orange); font-weight: 600; }
